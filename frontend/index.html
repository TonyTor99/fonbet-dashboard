<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fonbet Dashboard</title>
  <link rel="stylesheet" href="/app.css?v=6" />
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script src="/vendor/chart.js"></script>
  <script src="/vendor/babel.js"></script>
</head>
<body>
  <div id="root">Загрузка…</div>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// --- API ---
async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || 'Ошибка запроса');
  return data;
}
const getSources = () => api('/api/sources');
const getSourceMeta = (k) => api('/api/source/' + k);
const getStatus = () => api('/api/status');
const runBacktest = (p) => api('/api/backtest', {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p),
});
const doRefreshReq = () => api('/api/refresh', { method: 'POST' });

const fmt = (n) => (n === null || n === undefined) ? '—'
  : new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(n);

// --- История расчётов (постоянное хранение на сервере, отдельно по источникам) ---
const getHistory = (src) => api('/api/history/' + src);
const postHistory = (src, payload) => api('/api/history/' + src, {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
});
const delHistory = (src, id) => api('/api/history/' + src + '/' + id, { method: 'DELETE' });
const clearHistoryReq = (src) => api('/api/history/' + src, { method: 'DELETE' });
const favHistoryReq = (src, id, favorite) => api('/api/history/' + src + '/' + id + '/favorite', {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ favorite }),
});

const DEFAULT_F = {
  market: '', entryKind: '', entryN: '',
  oddsMin: '', oddsMax: '',
  lines: [], lineMin: '', lineMax: '',
  leagues: [], dateFrom: '', dateTo: '',
  timeWindows: '',
  zapas: {}, pairs: [],
  stake: 1000, bank: 100000,
};

// Короткое имя лиги IPBL для подписей
const shortLeague = (lg) => (lg || '')
  .replace('Россия. IPBL. ', '').replace('Шорт-хоккей. ', '');

// Ключ пары (порядок команд из бэкенда уже нормализован)
const pairKey = (p) => p[0] + ' ||| ' + p[1];
const fmtLineVal = (v) => (v > 0 ? '+' + v : '' + v);

// '10:00-12:00, 16:00-18:00' -> [['10:00','12:00'], ['16:00','18:00']]
const padHM = (t) => { const [h, m] = t.split(':'); return h.padStart(2, '0') + ':' + m; };
function parseWindows(str) {
  if (!str) return [];
  return str.split(',').map((s) => s.trim()).filter(Boolean).map((part) => {
    const seg = part.split('-').map((x) => x.trim());
    if (seg.length === 2 && /^\d{1,2}:\d{2}$/.test(seg[0]) && /^\d{1,2}:\d{2}$/.test(seg[1]))
      return [padHM(seg[0]), padHM(seg[1])];
    return null;
  }).filter(Boolean);
}

// --- График прибыли на Chart.js ---
function ProfitChart({ curve }) {
  const ref = useRef(null);
  const chart = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chart.current) chart.current.destroy();
    chart.current = new Chart(ref.current, {
      type: 'line',
      data: {
        labels: curve.map((p) => p.date),
        datasets: [{
          label: 'Прибыль, %', data: curve.map((p) => p.cum_profit_pct),
          borderColor: '#4ade80', backgroundColor: 'rgba(74,222,128,0.08)',
          borderWidth: 2, pointRadius: 0, tension: 0.15, fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#8b95a7', maxTicksLimit: 12 }, grid: { color: '#2a3142' } },
          y: { ticks: { color: '#8b95a7', callback: (v) => v + '%' }, grid: { color: '#2a3142' } },
        },
      },
    });
    return () => { if (chart.current) chart.current.destroy(); };
  }, [curve]);
  if (!curve || !curve.length) return <div className="chart-empty">Нет данных для графика</div>;
  return <div style={{ height: 320 }}><canvas ref={ref}></canvas></div>;
}

// --- Столбчатый график прибыли (по дням / дням недели) ---
function BarChart({ data, labelKey, height }) {
  const ref = useRef(null);
  const chart = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chart.current) chart.current.destroy();
    const vals = data.map((p) => p.profit);
    const counts = data.map((p) => p.matches);
    const hasCounts = counts.some((c) => c !== undefined && c !== null);
    const datasets = [{
      type: 'bar', label: 'Прибыль', data: vals, yAxisID: 'y', order: 2,
      backgroundColor: vals.map((v) => v >= 0 ? 'rgba(74,222,128,0.55)' : 'rgba(248,113,113,0.55)'),
      borderColor: vals.map((v) => v >= 0 ? '#4ade80' : '#f87171'),
      borderWidth: 1,
    }];
    if (hasCounts) datasets.push({
      type: 'line', label: 'Матчей', data: counts, yAxisID: 'y1', order: 1,
      borderColor: '#60a5fa', backgroundColor: 'transparent',
      borderWidth: 2, pointRadius: 2, pointBackgroundColor: '#60a5fa', tension: 0.15,
    });
    chart.current = new Chart(ref.current, {
      data: { labels: data.map((p) => p[labelKey]), datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: hasCounts, labels: { color: '#8b95a7', boxWidth: 12 } } },
        scales: {
          x: { ticks: { color: '#8b95a7', maxTicksLimit: 16 }, grid: { color: '#2a3142' } },
          y: { position: 'left', ticks: { color: '#8b95a7', callback: (v) => fmt(v) }, grid: { color: '#2a3142' } },
          y1: { position: 'right', display: hasCounts, beginAtZero: true,
                ticks: { color: '#60a5fa', precision: 0 }, grid: { drawOnChartArea: false } },
        },
      },
    });
    return () => { if (chart.current) chart.current.destroy(); };
  }, [data]);
  if (!data || !data.length) return <div className="chart-empty">Нет данных</div>;
  return <div style={{ height: height || 260 }}><canvas ref={ref}></canvas></div>;
}

function Card({ label, value, sub, color, big }) {
  return (
    <div className={'card' + (big ? ' card-big' : '')}>
      <div className="card-label">{label}</div>
      <div className={'card-value ' + (color || '')}>{value}</div>
      {sub && <div className="card-sub">{sub}</div>}
    </div>
  );
}

function Results({ result }) {
  const m = result.metrics;
  const pos = m.profit >= 0;
  return (
    <React.Fragment>
      <div className="cards">
        <Card big label="Прибыль" value={m.profit_pct + '%'} sub={fmt(m.profit)} color={pos ? 'green' : 'red'} />
        <Card label="ROI" value={m.roi + '%'} color={m.roi >= 0 ? 'green' : 'red'} />
        <Card label="Оборот" value={fmt(m.turnover)} />
        <Card label="Ставок / матчей" value={m.bets + ' / ' + m.matches} />
        <Card label="Винрейт" value={m.winrate + '%'} sub={m.wins + 'W / ' + m.losses + 'L' + (m.pushes ? ' / ' + m.pushes + 'P' : '')} />
        <Card label="Средний кф" value={m.avg_odds} />
        <Card label="Макс. просадка" value={m.max_drawdown_pct + '%'} sub={fmt(m.max_drawdown)} color="red" />
        <Card label="Просадка, дней" value={m.max_drawdown_days} sub={'текущая: ' + m.current_drawdown_days} color={m.current_drawdown_days > 0 ? 'red' : ''} />
        <Card label="Макс. серия +/−" value={m.max_win_streak + ' / ' + m.max_lose_streak} sub="плюсов / минусов" />
      </div>
      <div className="panel">
        <div className="panel-title">Кривая прибыли (% от банка)</div>
        <ProfitChart curve={m.curve} />
      </div>
      <div className="panel-row">
        <div className="panel">
          <div className="panel-title">Прибыль по дням</div>
          <BarChart data={m.daily_profit} labelKey="date" />
        </div>
        <div className="panel">
          <div className="panel-title">Прибыль по дням недели</div>
          <BarChart data={m.weekday_profit} labelKey="day" height={260} />
        </div>
      </div>
      {result.pairs && result.pairs.length > 0 && (
        <div className="panel">
          <div className="panel-title">Статистика встреч пар ({result.pairs.length})</div>
          <PairsTable pairs={result.pairs} />
        </div>
      )}
      <div className="panel">
        <div className="panel-title">
          Ставки {result.bets_total > result.bets.length ? '(первые ' + result.bets.length + ' из ' + result.bets_total + ')' : ''}
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th>Дата</th><th>Матч</th><th>Мин</th><th>Исход</th>
              <th>Линия</th><th>Кф</th><th>Счёт</th><th>Результат</th><th>Профит</th>
            </tr></thead>
            <tbody>
              {result.bets.map((b, i) => (
                <tr key={i}>
                  <td className="nowrap">{b.date}</td>
                  <td>{b.team1} — {b.team2}</td>
                  <td>{b.game_minute == null ? '—' : b.game_minute}</td>
                  <td>{b.side || '—'}</td>
                  <td>{b.line == null ? '—' : b.line}</td>
                  <td>{b.odds}</td>
                  <td>{b.final_score || '—'}</td>
                  <td className={b.result === 'Выигрыш' ? 'win' : b.result === 'Проигрыш' ? 'lose' : ''}>{b.result}</td>
                  <td className={b.profit >= 0 ? 'win' : 'lose'}>{fmt(b.profit)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </React.Fragment>
  );
}

// --- Фильтр по линии: форы — чекбоксы значений; тоталы/инд.тоталы — диапазон ---
function LineFilter({ market, values, f, upd, toggleArr }) {
  if (!market || !market.line) return null;
  const vals = values || [];
  if (market.group === 'Фора') {
    return (
      <div className="fld"><span>Значения форы ({f.lines.length ? f.lines.length : 'все'})</span>
        <div className="checks">
          {vals.map((v) => (
            <label key={v} className="check">
              <input type="checkbox" checked={f.lines.includes(v)} onChange={() => toggleArr('lines', v)} />
              {fmtLineVal(v)}
            </label>
          ))}
          {!vals.length && <div className="team-more">нет значений</div>}
        </div>
      </div>
    );
  }
  // Тотал / инд. тотал — диапазон от/до (подсказка — доступный диапазон)
  const lo = vals.length ? vals[0] : '';
  const hi = vals.length ? vals[vals.length - 1] : '';
  return (
    <div className="fld row">
      <label><span>Линия от</span><input type="number" step="0.5" placeholder={'' + lo}
        value={f.lineMin} onChange={(e) => upd('lineMin', e.target.value)} /></label>
      <label><span>Линия до</span><input type="number" step="0.5" placeholder={'' + hi}
        value={f.lineMax} onChange={(e) => upd('lineMax', e.target.value)} /></label>
    </div>
  );
}

// --- Фильтр по парам: поиск + список реальных встреч, выбранные — чипами сверху ---
function PairFilter({ pairs, selected, onAdd, onRemove }) {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const selKeys = new Set(selected.map(pairKey));
  const ql = q.trim().toLowerCase();
  const avail = pairs.filter((p) => !selKeys.has(pairKey(p)));
  const list = ql ? avail.filter((p) => (p[0] + ' ' + p[1]).toLowerCase().includes(ql)) : avail;
  return (
    <div className="fld">
      <span className="collapse-head" onClick={() => setOpen((v) => !v)}>
        <span className="chevron">{open ? '▾' : '▸'}</span>
        Пары ({selected.length ? selected.length : 'все'})
      </span>
      {selected.length > 0 && (
        <div className="team-selected">
          {selected.map((p) => (
            <div key={pairKey(p)} className="team-sel-row">
              <span className="team-name" title={p[0] + ' — ' + p[1]}>{p[0]} — {p[1]}</span>
              <button type="button" className="team-x" title="убрать" onClick={() => onRemove(p)}>×</button>
            </div>
          ))}
        </div>
      )}
      {open && (
        <React.Fragment>
          <input className="team-search" placeholder="поиск пары…" value={q} onChange={(e) => setQ(e.target.value)} />
          <div className="team-list">
            {list.slice(0, 80).map((p) => (
              <div key={pairKey(p)} className="check pair-add"
                   onClick={() => { onAdd(p); setQ(''); }}>
                + {p[0]} — {p[1]}
              </div>
            ))}
            {list.length > 80 && <div className="team-more">…ещё {list.length - 80}, уточни поиск</div>}
            {!list.length && <div className="team-more">{avail.length ? 'ничего не найдено' : 'все пары выбраны'}</div>}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// --- Таблица статистики пар (поиск + сортировка по колонкам) ---
function PairsTable({ pairs }) {
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('n');
  const ql = q.trim().toLowerCase();
  let list = ql ? pairs.filter((p) => p.pair.toLowerCase().includes(ql)) : pairs.slice();
  list.sort((a, b) => (sort === 'pair' ? a.pair.localeCompare(b.pair) : b[sort] - a[sort]));
  const th = (key, label) => (
    <th className="sortable" onClick={() => setSort(key)}>{label}{sort === key ? ' ▾' : ''}</th>
  );
  return (
    <React.Fragment>
      <input className="team-search" placeholder="поиск пары…" value={q} onChange={(e) => setQ(e.target.value)} />
      <div className="table-wrap">
        <table>
          <thead><tr>
            {th('pair', 'Пара')}{th('n', 'Кол-во')}{th('winrate', 'Винрейт')}{th('profit', 'Прибыль')}{th('roi', 'ROI')}
          </tr></thead>
          <tbody>
            {list.slice(0, 300).map((p, i) => (
              <tr key={i}>
                <td>{p.pair}</td>
                <td>{p.n}</td>
                <td>{p.winrate}%</td>
                <td className={p.profit >= 0 ? 'win' : 'lose'}>{fmt(p.profit)}</td>
                <td className={p.roi >= 0 ? 'win' : 'lose'}>{p.roi}%</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </React.Fragment>
  );
}

function App() {
  const [sources, setSources] = useState([]);
  const [sourceKey, setSourceKey] = useState('');
  const [meta, setMeta] = useState(null);
  const [f, setF] = useState(DEFAULT_F);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [status, setStatus] = useState(null);
  const [msg, setMsg] = useState('');
  const [history, setHistory] = useState([]);
  const [histOpen, setHistOpen] = useState(true);

  useEffect(() => {
    getSources().then((s) => { setSources(s); if (s.length) setSourceKey(s[0].key); });
    getStatus().then(setStatus);
  }, []);

  // История подгружается заново при смене источника
  useEffect(() => {
    if (!sourceKey) { setHistory([]); return; }
    getHistory(sourceKey).then(setHistory).catch(() => setHistory([]));
  }, [sourceKey]);

  useEffect(() => {
    if (!sourceKey) return;
    setMeta(null); setResult(null); setError('');
    getSourceMeta(sourceKey).then((m) => {
      setMeta(m);
      const nf = { ...DEFAULT_F, dateFrom: m.date_from || '', dateTo: m.date_to || '' };
      if (m.kind !== 'signals') {
        nf.market = (m.markets[0] || {}).code || '';
        nf.entryKind = (m.entry_points[0] || {}).kind || '';
        const ep = m.entry_points[0];
        if (ep && ep.values) nf.entryN = ep.values[0];
      } else {
        // Сигналы: запас по умолчанию из бота, лиги — все
        nf.zapas = { ...(m.zapas_default || {}) };
        nf.leagues = [];
      }
      setF(nf);
    }).catch((e) => setError(e.message));
  }, [sourceKey]);

  const upd = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const toggleArr = (k, v) => setF((p) => ({
    ...p, [k]: p[k].includes(v) ? p[k].filter((x) => x !== v) : [...p[k], v],
  }));
  const num = (v) => (v === '' || v === null ? null : Number(v));
  const addPair = (pr) => setF((p) =>
    p.pairs.some((x) => pairKey(x) === pairKey(pr)) ? p : { ...p, pairs: [...p.pairs, pr] });
  const removePair = (pr) => setF((p) => ({ ...p, pairs: p.pairs.filter((x) => pairKey(x) !== pairKey(pr)) }));
  // Смена рынка сбрасывает фильтры линии (у разных рынков разные значения)
  const changeMarket = (code) => setF((p) => ({ ...p, market: code, lines: [], lineMin: '', lineMax: '' }));

  async function calc() {
    setLoading(true); setError(''); setResult(null);
    try {
      const base = {
        source: sourceKey,
        odds_min: num(f.oddsMin), odds_max: num(f.oddsMax),
        leagues: f.leagues, date_from: f.dateFrom || null, date_to: f.dateTo || null,
        time_windows: parseWindows(f.timeWindows),
        pairs: f.pairs,
        stake: num(f.stake) || 1000, bank: num(f.bank) || 100000,
      };
      let params;
      if (meta.kind === 'signals') {
        params = { ...base, zapas: f.zapas };
      } else {
        params = { ...base, market: f.market,
          entry: { kind: f.entryKind, n: f.entryN === '' ? null : Number(f.entryN) },
          lines: f.lines, line_min: num(f.lineMin), line_max: num(f.lineMax) };
      }
      const res = await runBacktest(params);
      setResult(res);
      saveHistoryEntry(params, res.metrics);
    } catch (e) { setError(e.message); } finally { setLoading(false); }
  }

  // Сохранить текущий расчёт в историю источника (на сервере)
  async function saveHistoryEntry(params, metrics) {
    const payload = {
      form: JSON.parse(JSON.stringify(f)),   // снимок формы для восстановления
      params,
      summary: { bets: metrics.bets, winrate: metrics.winrate,
                 profit_pct: metrics.profit_pct, roi: metrics.roi },
    };
    try {
      const entry = await postHistory(sourceKey, payload);
      setHistory((arr) => [entry, ...arr]);
    } catch (e) { /* история не критична — не мешаем расчёту */ }
  }

  async function deleteHistory(id) {
    try { await delHistory(sourceKey, id); setHistory((arr) => arr.filter((e) => e.id !== id)); }
    catch (e) {}
  }

  async function toggleFavorite(entry) {
    const val = !entry.favorite;
    try {
      const upd = await favHistoryReq(sourceKey, entry.id, val);
      setHistory((arr) => arr.map((e) => e.id === upd.id ? upd : e));
    } catch (e) {}
  }

  async function clearHistory() {
    try { await clearHistoryReq(sourceKey); setHistory([]); } catch (e) {}
  }

  // Восстановить параметры расчёта из истории и показать результат
  async function restoreHistory(entry) {
    setF({ ...DEFAULT_F, ...entry.form });
    setLoading(true); setError(''); setResult(null);
    try { setResult(await runBacktest(entry.params)); }
    catch (e) { setError(e.message); }
    finally { setLoading(false); }
  }

  async function refresh() {
    setMsg('Обновляю…');
    try {
      const r = await doRefreshReq();
      setMsg('Обновлено: ' + r.updated_at + ' (' + r.updated.length + ' БД)');
      getStatus().then(setStatus);
    } catch (e) { setMsg('⚠ ' + e.message); }
  }

  const curEntry = meta && meta.entry_points ? meta.entry_points.find((e) => e.kind === f.entryKind) : null;
  const curMarket = meta && meta.markets ? meta.markets.find((m) => m.code === f.market) : null;
  const curLineVals = curMarket && meta.line_values ? meta.line_values[curMarket.line] : null;

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">📊 Fonbet Dashboard</div>
        <div className="topbar-right">
          <span className="status">
            Снимки: {status && status.snapshots_updated ? status.snapshots_updated : '—'}
            {status && !status.live_available && <span className="badge">локально</span>}
          </span>
          <button className="btn-refresh" onClick={refresh}
                  disabled={status && !status.live_available}
                  title={status && !status.live_available ? 'Доступно только на сервере' : ''}>
            ⟳ Обновить данные
          </button>
        </div>
      </header>
      {msg && <div className="msg">{msg}</div>}

      <div className="layout">
        <aside className="filters">
          <label className="fld"><span>Источник</span>
            <select value={sourceKey} onChange={(e) => setSourceKey(e.target.value)}>
              {sources.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}
            </select>
          </label>

          {meta && meta.kind !== 'signals' && (
            <React.Fragment>
              <label className="fld"><span>Рынок / исход</span>
                <select value={f.market} onChange={(e) => changeMarket(e.target.value)}>
                  {meta.markets.map((m) => <option key={m.code} value={m.code}>{m.group} — {m.label}</option>)}
                </select>
              </label>
              <LineFilter market={curMarket} values={curLineVals} f={f} upd={upd} toggleArr={toggleArr} />
              <div className="fld"><span>Момент входа</span>
                {meta.entry_points.map((ep) => (
                  <label key={ep.kind} className="radio">
                    <input type="radio" name="entry" checked={f.entryKind === ep.kind}
                      onChange={() => { upd('entryKind', ep.kind); upd('entryN', ep.values ? ep.values[0] : ''); }} />
                    {ep.label}
                  </label>
                ))}
                {curEntry && curEntry.kind === 'minute' && (
                  <input type="number" min="0" placeholder="номер минуты" value={f.entryN}
                    onChange={(e) => upd('entryN', e.target.value)} />
                )}
                {curEntry && curEntry.values && (
                  <select value={f.entryN} onChange={(e) => upd('entryN', Number(e.target.value))}>
                    {curEntry.values.map((v) => <option key={v} value={v}>{v}</option>)}
                  </select>
                )}
              </div>
              <div className="fld row">
                <label><span>Кф от</span><input type="number" step="0.01" value={f.oddsMin} onChange={(e) => upd('oddsMin', e.target.value)} /></label>
                <label><span>Кф до</span><input type="number" step="0.01" value={f.oddsMax} onChange={(e) => upd('oddsMax', e.target.value)} /></label>
              </div>
              {meta.leagues.length > 1 && (
                <div className="fld"><span>Лиги ({f.leagues.length ? f.leagues.length : 'все'})</span>
                  <div className="checks">
                    {meta.leagues.map((lg) => (
                      <label key={lg} className="check">
                        <input type="checkbox" checked={f.leagues.includes(lg)} onChange={() => toggleArr('leagues', lg)} />
                        {lg.replace('Шорт-хоккей. ', '')}
                      </label>
                    ))}
                  </div>
                </div>
              )}
            </React.Fragment>
          )}

          {meta && meta.kind === 'signals' && (
            <React.Fragment>
              <div className="fld"><span>Лиги и запас ({f.leagues.length ? f.leagues.length : 'все'})</span>
                <div className="zapas-hint">Сигнал: 2×сумма − линия ≤ запас (со знаком)</div>
                <div className="checks">
                  {meta.leagues.map((lg) => (
                    <div key={lg} className="zapas-row">
                      <label className="check">
                        <input type="checkbox" checked={f.leagues.includes(lg)} onChange={() => toggleArr('leagues', lg)} />
                        {shortLeague(lg)}
                      </label>
                      <input type="number" className="zapas-inp" value={f.zapas[lg] == null ? '' : f.zapas[lg]}
                        title="запас"
                        onChange={(e) => upd('zapas', { ...f.zapas, [lg]: e.target.value === '' ? null : Number(e.target.value) })} />
                    </div>
                  ))}
                </div>
              </div>
              <div className="fld row">
                <label><span>Кф от</span><input type="number" step="0.01" value={f.oddsMin} onChange={(e) => upd('oddsMin', e.target.value)} /></label>
                <label><span>Кф до</span><input type="number" step="0.01" value={f.oddsMax} onChange={(e) => upd('oddsMax', e.target.value)} /></label>
              </div>
            </React.Fragment>
          )}

          {meta && meta.pairs && meta.pairs.length > 0 && (
            <PairFilter pairs={meta.pairs} selected={f.pairs} onAdd={addPair} onRemove={removePair} />
          )}

          <div className="fld row">
            <label><span>Дата от</span><input type="date" value={f.dateFrom} onChange={(e) => upd('dateFrom', e.target.value)} /></label>
            <label><span>Дата до</span><input type="date" value={f.dateTo} onChange={(e) => upd('dateTo', e.target.value)} /></label>
          </div>
          <label className="fld"><span>Время суток МСК (интервалы)</span>
            <input type="text" placeholder="10:00-12:00, 16:00-18:00"
              value={f.timeWindows} onChange={(e) => upd('timeWindows', e.target.value)} />
          </label>
          <div className="fld row">
            <label><span>Ставка</span><input type="number" value={f.stake} onChange={(e) => upd('stake', e.target.value)} /></label>
            <label><span>Банк</span><input type="number" value={f.bank} onChange={(e) => upd('bank', e.target.value)} /></label>
          </div>

          <button className="btn-calc" onClick={calc} disabled={loading || !meta}>
            {loading ? 'Считаю…' : 'Рассчитать'}
          </button>
          {error && <div className="err">{error}</div>}

          {history.length > 0 && (
            <div className="fld">
              <span className="collapse-head" onClick={() => setHistOpen((v) => !v)}>
                <span className="chevron">{histOpen ? '▾' : '▸'}</span>
                История ({history.length})
              </span>
              {histOpen && (
                <div className="hist-list">
                  {history.slice().sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0)).map((e) => (
                    <div key={e.id} className={'hist-row' + (e.favorite ? ' hist-fav' : '')}>
                      <button type="button" className={'hist-star' + (e.favorite ? ' on' : '')}
                              title={e.favorite ? 'Убрать из избранного' : 'В избранное'}
                              onClick={() => toggleFavorite(e)}>{e.favorite ? '★' : '☆'}</button>
                      <div className="hist-main" onClick={() => restoreHistory(e)} title="Показать этот расчёт">
                        <div className="hist-ts">{e.ts}</div>
                        <div className="hist-sum">
                          {e.summary.bets} ст ·{' '}
                          <span className={e.summary.profit_pct >= 0 ? 'win' : 'lose'}>
                            {e.summary.profit_pct >= 0 ? '+' : ''}{e.summary.profit_pct}%
                          </span>{' '}· ВР {e.summary.winrate}%
                        </div>
                      </div>
                      <button type="button" className="team-x" title="удалить" onClick={() => deleteHistory(e.id)}>×</button>
                    </div>
                  ))}
                  <div className="hist-clear" onClick={clearHistory}>Очистить историю (избранное останется)</div>
                </div>
              )}
            </div>
          )}
        </aside>

        <main className="content">
          {!result && <div className="placeholder">Задай фильтры слева и нажми «Рассчитать»</div>}
          {result && <Results result={result} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
